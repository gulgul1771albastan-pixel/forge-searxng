services:
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:rw
      - ./out/crabx:/usr/local/searxng/searx/templates/simple
      - ./out/crabx-static:/usr/local/searxng/searx/static/themes/simple
    restart: unless-stopped
