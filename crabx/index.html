{% extends "simple/base.html" %}
{% block content %}
<style>
  .forge-home {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 18vh 1rem 2rem 1rem;
    width: 100%;
    box-sizing: border-box;
  }
  .forge-brand {
    font-size: 4.5rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: #5e81ac;
    margin: 0 0 2rem 0;
    text-align: center;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
  }
  html.theme-dark .forge-brand,
  html.theme-black .forge-brand {
    color: #88c0d0;
  }

  .forge-home #search,
  .forge-home #search_header,
  .forge-home #search_view,
  .forge-home .search_box {
    width: 100% !important;
    max-width: 720px !important;
    margin-left: auto !important;
    margin-right: auto !important;
  }
  .forge-home .search_box {
    display: flex !important;
    align-items: center !important;
  }
  .forge-home #q {
    width: 100% !important;
    flex: 1 1 auto !important;
  }
</style>
<div class="forge-home">
  <div class="forge-brand">FORGE SEARCH</div>
  {% include 'simple/simple_search.html' %}
</div>
{% endblock %}
