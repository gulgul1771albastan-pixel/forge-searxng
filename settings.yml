use_default_settings: true

general:
  instance_name: "Forge Search"

server:
  secret_key: "change-this-to-any-long-random-text"
  limiter: false
  image_proxy: true

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  formats:
    - html
    - json

ui:
  default_theme: simple
  center_alignment: false
  theme_args:
    simple_style: light
